[package]
name = "reemoat-native"
edition = "2021"
rust-version = "1.85"
description = "The Reemoat native shell."
license = "AGPL-3.0-only"
publish = false

# Inert: the release lives in the root manifest, and `nativecheck` asserts this stays 0.0.0.
version = "0.0.0"

[lib]
name = "reemoat_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2.3.3"
# host_save_file's writer: Android's save panel answers a content:// URI only ContentResolver opens.
tauri-plugin-fs = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
# `default-tls` is rustls with `rustls-platform-verifier`, the OS trust store on every platform, so a
# private CA works; on Android it must be initialised by hand (`credential.rs`). `gzip`: both services gzip over 8 KiB.
reqwest = { version = "0.13.5", default-features = false, features = [
  "default-tls",
  "charset",
  "http2",
  "system-proxy",
  "gzip",
] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
getrandom = "0.3"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Every `[target.…]` table sits below `[dependencies]` and at the end of the file: `tauri build` rewrites
# tauri's features in the first dependency table it meets (Q3.697), and a target header swallows every key below it.

# SIGTERM for the daemon's graceful stop; `Child::kill` is SIGKILL. Windows has none, so its stop is ungraceful.
[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

# `unstable` is the multi-webview arm's (`seats.rs`), on macOS alone; it changes window building elsewhere.
# An unstable API moves in minor releases, so `nativecheck` pins the locked tauri and tauri-runtime-wry.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.5", features = ["unstable"] }
# For `seats.rs`'s `_close` and `lib.rs`'s typing substitutions (Q3.647), which Tauri's API does not reach.
objc2 = "0.6.4"

# The tray and single-instance for `away.rs` (Q3.697). `~2.4`: 2.5 asks for tauri 2.12, past the pinned pair.
[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "~2.4.5"

# The default feature is named: a default that became a memory store would compile and forget.
# Desktop only: `v1` refuses iOS and Android at run time.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

# No openssl: on Android `reqwest` resolves to rustls with the platform verifier, which honours
# user-installed CAs and needs its Kotlin half in the APK (native-packaging.md).
[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
# `credential.rs` initialises `ndk-context` itself; nothing else in the tree does, and the store panics without it.
jni = "0.21"
ndk-context = "0.1"

# Named so `credential.rs` can initialise it; without that the first `/v1` request panics. Must be the copy
# `reqwest` resolved to, or the initialised static is not the one read; `nativecheck` asserts one copy.
rustls-platform-verifier = "0.7.0"
# The verifier's `init_with_env` takes 0.22's `Env`; everything else is on 0.21, so both are in the build.
jni22 = { package = "jni", version = "0.22.4", default-features = false }

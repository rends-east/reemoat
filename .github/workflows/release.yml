# Publishing a release, from a tag rather than from a button.
#
# `deploy.yml` is `workflow_dispatch` and nothing else, because *when* to deploy
# is a judgement about somebody's running work. A release is the opposite shape:
# the judgement was exercised the moment a person typed `git tag v0.1.0`, and the
# tag is the record of it. So the tag push is the trigger, and there is no second
# button to press — which keeps "nothing happens on a push to a branch" true while
# not pretending that tagging is accidental.
#
# There is deliberately **no `workflow_dispatch`**. The case it would serve is a
# GHCR hiccup after the image was built, and GitHub's own re-run-jobs button
# already covers that with the same ref, the same tag and the same commit. A
# second entry point would be a second way to answer "which commit is v0.1.0",
# and the two could disagree.
#
# **This file decides nothing**, the same correction `deploy.yml` exists in.
# Every refusal — a tag the six version sites disagree with, a commit whose `check`
# run is not green, a tag that already has a release or an image, an empty
# changelog section, a digest directory a skipped matrix leg left behind — is in
# `deploy/ci-release.sh`, where `deploycheck` drives it with no registry, no forge
# and no network. What is left here is a checkout and six calls of five verbs —
# and `deploycheck` now reads this file back against that script's own `case`, in
# both directions, so a verb with no job and a job with no verb are each one red
# line rather than something a reader has to notice. It was not always: the `app`
# verb shipped with nine refusals, ~125 lines and no caller, while four documents
# described the wiring anyway.
#
# The job order is `plan → image → manifest → publish`, with `app` and
# `app-android` beside `image` under `plan`, and `publish` is last on purpose: a
# GitHub Release whose image does not exist is the failure that looks like
# success, and it is the one a reader would find months later.
#
# ⚠ **`app` and `app-android` build nothing today, and that is the gate rather
# than an omission.** `RELEASE_APP_TARGETS` is empty in `ci-release.sh` until a
# platform has a `check.yml` leg, so `plan` emits an empty matrix, both jobs skip
# on their own `if:`, and a release publishes exactly what it published before
# they existed: the notes, and the installer. They are written now rather than on
# the day a target is added because the day a signing key is first plumbed
# through a workflow is the worst day to also be writing the workflow.

name: release

on:
  push:
    tags: ['v*']

# Nothing by default, and each job takes only what it needs. `plan` in particular
# can write nothing anywhere — it is the job that runs every gate, and a gate does
# not need a token that could publish.
permissions: {}

concurrency:
  # `deploy.yml`'s reasoning in a sharper form. A superseded test run is answering
  # a stale question; a superseded *release* is a half-pushed manifest, with some
  # tags moved and some not. Keyed on the ref rather than a constant, because two
  # different tags releasing at once is fine and two runs on the same tag is
  # exactly what must not overlap.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can refuse, before anything reaches a registry. A bad tag
  # costs seconds here and never gets as far as a build.
  plan:
    runs-on: ubuntu-latest
    # Above `RELEASE_CHECK_WAIT_SECONDS` (2700), so a check gate that times out
    # is this script's sentence rather than a runner kill with no explanation.
    timeout-minutes: 45
    permissions:
      contents: read
      # The check gate reads workflow runs through `gh run list`. Without this the
      # call returns nothing, the verdict reads as "none", and every release
      # refuses — the safe direction, but for a reason that has nothing to do with
      # the commit.
      actions: read
      # ⚠ And the re-release gate reads the *registry*, through
      # `buildx imagetools inspect`. Without a credential that call fails for
      # "unauthorized" and the script's `>/dev/null 2>&1` collapses that into the
      # same answer as "not published" — so the gate `ci-release.sh` calls "where a
      # genuine re-release is caught" would fail **open** against a private package
      # and let a release move a tag somebody has already pulled. Read-only, which
      # keeps this job's "can write nothing anywhere" true.
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      image: ${{ steps.plan.outputs.image }}
      # What the two app jobs below are gated on and built from, all four derived
      # by `plan` from one list in `ci-release.sh`. `app_targets` is the word list
      # a person reads and what `publish`'s download step is gated on;
      # `app_matrix` is the same thing as JSON, in the form `fromJSON` feeds a
      # matrix directly; `app_desktop` and `app_android` are what the `if:` lines
      # compare, and they exist because an empty matrix here is a job that fails
      # rather than one that skips — "no targets today" has to be sayable before
      # the matrix is evaluated at all.
      app_targets: ${{ steps.plan.outputs.app_targets }}
      app_matrix: ${{ steps.plan.outputs.app_matrix }}
      app_desktop: ${{ steps.plan.outputs.app_desktop }}
      app_android: ${{ steps.plan.outputs.app_android }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The tag's own commit, and the whole history behind it — the same
          # reason `deploy.yml` gives, so an older ref still resolves.
          fetch-depth: 0

      # The re-release gate asks the registry, so this job needs to be able to
      # ask. See `packages: read` above for what a missing credential turns that
      # question into.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
        run: deploy/ci-release.sh plan

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/reemoat-release/notes.md
          if-no-files-found: error
          # A re-run of this job uploads the same name again, and without this
          # that is a conflict rather than a replacement — which would break the
          # re-run-jobs button this file names as its whole recovery story.
          overwrite: true

  # The image, one job per architecture, each pushing **by digest** and claiming
  # no tag. Its own job because it is the only part of this workflow that needs
  # Docker, a registry and a network — the same sentence `check.yml`'s header uses
  # about its own image job, and true here for the same reason.
  #
  # Adding `linux/arm64` is one entry below plus one matrix entry in `check.yml`'s
  # image job, so `imagecheck` builds and starts it before a release publishes it.
  # The script's `RELEASE_PLATFORMS` comment is the argument for why that order
  # and not the other one.
  image:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # ⚠ **Not optional, and its absence was a hard stop.** The check gate in
      # `ci-release.sh` is above the verb dispatch, so it runs for *every* verb —
      # which the script's own header says out loud ("every one of them re-runs
      # every gate"). Only `plan` had this, so `gh run list` here returned nothing,
      # the verdict read "unknown", and this job refused before building anything.
      # The release workflow could not complete a single release.
      actions: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: deploy/ci-release.sh image

      - uses: actions/upload-artifact@v7
        with:
          # One artifact per architecture, named after it, so `manifest` can merge
          # them into one directory without two legs overwriting each other.
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/reemoat-release/digests/*
          if-no-files-found: error
          # Same reason as `release-notes` above: re-running one matrix leg must
          # replace its digest, not collide with the one it wrote last time.
          overwrite: true

  # The digests, merged into the tags people type.
  #
  # ⚠ **It waits for every app, and that is what keeps a failed release from
  # spending its version.** This is the job that creates the tags people pull —
  # `image` pushes by digest and names nothing — and it used to need `image`
  # alone. So when v0.10.0's Linux leg died it pushed `:v0.10.0` and moved
  # `:latest` a minute later anyway: no release page, no apps, and a version the
  # re-release gate would never let be built again, because the image under its
  # name is public and somebody may have pulled it. Waiting costs nothing but
  # wall-clock — the image is built in parallel as before and only the naming
  # waits — and it means an app that fails leaves **nothing** published: fix it,
  # move the tag, run again.
  #
  # `skipped` counts as done for both app jobs, for the reason `publish`'s `if:`
  # gives: GitHub skips a job whose `needs` includes a skipped one unless it
  # carries a conditional, and a release with no app target skips them by design.
  manifest:
    needs: [image, app, app-android]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.app.result == 'success' || needs.app.result == 'skipped') && (needs['app-android'].result == 'success' || needs['app-android'].result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # The check gate again — see the `image` job. Every verb runs it.
      actions: read
      # Both needed by the attestation below, and by nothing else here.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/reemoat-release/digests

      - name: manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
        run: deploy/ci-release.sh manifest

      # One mechanism rather than two. buildx can export its own provenance
      # attestation and the script passes `--provenance=false` to stop it: that
      # form is verified by almost nobody, and it adds manifests to the index —
      # and `deploy/lib.sh` already records that the compose `provenance:` field
      # validates and is then ignored, which is the kind of surprise worth not
      # having twice. This one an operator checks with a single command:
      #
      #   gh attestation verify oci://<image>:<tag> --repo ${{ github.repository }}
      #
      # The subject is the **index** digest the previous step emitted, so the
      # attestation covers the manifest people actually pull rather than one
      # architecture inside it.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # The native app, one job per desktop target, each building and naming one
  # artifact. A **sibling** of `image` rather than a successor: an app artifact
  # has no merge step, so there is nothing between this and `publish` — the
  # script's own header makes the same point about the verb.
  #
  # ⚠ **The matrix is `plan`'s output, not a list written here.** `app_runner`,
  # `app_triple` and `RELEASE_APP_TARGETS` are one table in `ci-release.sh`,
  # `plan` emits it, and `deploycheck` drives the emitted JSON against fixture
  # lists. A hand-written `include:` would be a third list to keep in step with
  # that script and with `check.yml`, and the only one of the three that nothing
  # can check — which is the shape this whole file exists to avoid.
  #
  # ⚠ **The `if:` is load-bearing, and without it this job *fails* rather than
  # skips.** An empty matrix is not zero legs in GitHub Actions, it is an error,
  # and `RELEASE_APP_TARGETS` ships empty on purpose. `app_desktop` rather than
  # `app_targets`: a release asking for android alone has a non-empty target list
  # and an empty matrix, which is exactly the case that would have failed.
  app:
    needs: plan
    if: ${{ needs.plan.outputs.app_desktop != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # The check gate again — see the `image` job, which records what its
      # absence cost. Every verb re-runs every gate, this one included.
      #
      # Deliberately no `packages: read` and no registry login: the re-release
      # image gate runs here too and fails *open* without one, which `plan` —
      # which asks it in full, logged in, before anything is built — already
      # covers. A macOS or Windows runner has no docker to ask with anyway.
      actions: read
    strategy:
      # One leg failing must not spend the other five. It could not publish a
      # partial page in any case — `publish` refuses a named artifact it does not
      # have — but that refusal is the backstop and this is the cheap half.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.app_matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `check.yml`'s `native` job's reasoning, one act over: the runner image's
      # Rust moves without notice, and a cross target has to be added anyway —
      # both macOS legs run on the same arm64 runner, so `macos-x64` is a
      # cross-compile rather than a second machine.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # ⚠ **The step whose absence spent v0.10.0.** `check.yml`'s `linux-x64` leg
      # installed WebKitGTK and went green; this job builds the same bundle and did
      # not, and died in `gobject-sys`'s build script on a `pkg-config` miss. One
      # action for both, so the list cannot be edited on one side only —
      # `deploycheck` asserts this job and that one both use it.
      - uses: ./.github/actions/linux-app-deps
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native/src-tauri
          key: ${{ matrix.target }}

      # Two installs, and the second is not a mistake: `packages/native` is under
      # `packages/` and deliberately excluded from the workspace, so the root
      # install never reaches it and the Tauri CLI would not exist.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/native install --frozen-lockfile

      # `frontendDist` has to exist before Tauri reads the configuration, and the
      # failure otherwise is a path error that reads like a config bug.
      - run: pnpm web:build

      # ⚠ **No `pnpm native:stage` step, and that is the script's decision rather
      # than an omission here.** `ci-release.sh app` stages the payload itself for
      # a daemon-host target, and **refuses** a client target that has one lying
      # around — a runner is reused, `binaries/node-*` outlives the build that
      # staged it, and `tauri-build` copies whatever it finds. Staging in this
      # file would take that refusal away from every leg.

      # Which server this build's first screen opens on, said where whoever cut
      # the release reads first. Empty is a build with no default — a fork that set
      # no repository variable, or one whose variable was deleted — and that is
      # written out rather than left as a blank line nobody notices. Q4.127.
      - name: default server
        shell: bash
        env:
          SUGGESTED: ${{ vars.REEMOAT_DEFAULT_SERVER }}
        run: |
          echo "Default server compiled in: ${SUGGESTED:-none (the repository variable is unset)}" >> "$GITHUB_STEP_SUMMARY"

      - name: app
        # The one step in this workflow that can land on Windows, where the
        # default shell is pwsh and a POSIX script would not be run at all.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
          RELEASE_APP_TARGET: ${{ matrix.target }}
          # The `TAURI` seam is one word so the script can invoke it directly, and
          # there is no `tauri` on any runner's PATH — the CLI is a dependency of
          # `packages/native` and of nothing else in this tree.
          TAURI: ${{ github.workspace }}/packages/native/node_modules/.bin/tauri
          # The one build-time input this app has — the variable of that name,
          # read at compile time by `config.rs` — forwarded from a **repository
          # variable**, never a literal and never a secret: this repository still
          # names nobody's server, and a fork inherits none. Unset, it expands to
          # the empty string, which the app reads as no default. `nativecheck`
          # allows exactly this line, in this job and the Android one, and
          # asserts both are here. Q4.127.
          REEMOAT_DEFAULT_SERVER: ${{ vars.REEMOAT_DEFAULT_SERVER }}
        run: deploy/ci-release.sh app

      - uses: actions/upload-artifact@v7
        with:
          # `app-` prefixed, because `publish` downloads `pattern: app-*` and
          # `digest-*` is the other family in this run. Named after the target
          # rather than after `strategy.job-index`, which the `image` job can use
          # because its legs are interchangeable and these are not: `app-3` tells
          # somebody re-running one leg nothing about which one.
          name: app-${{ matrix.target }}
          path: ${{ runner.temp }}/reemoat-release/apps/*
          if-no-files-found: error
          # Same reason as `release-notes` and `digest-*`: a re-run of one leg
          # must replace its artifact rather than collide with it.
          overwrite: true

  # Android, which is a job rather than a matrix leg.
  #
  # ⚠ **Because of the four secrets, and that is the whole reason.**
  # `ci-release.sh`'s `plan` explains at length why it does not check them: they
  # are scoped *here*, so "who can read the signing key" is answerable by reading
  # this file. A matrix cannot scope a secret to one entry, so folding android in
  # above would hand the keystore to every desktop leg as well — and to `plan`,
  # the job whose whole stated property is that it can write nothing anywhere.
  #
  # The second reason is ordinary: an APK wants a JDK, the Android SDK, the NDK
  # and a Gradle run, and shares no step with `tauri build` except the checkout.
  app-android:
    needs: plan
    if: ${{ needs.plan.outputs.app_android == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # The check gate again. See the `app` job above for why there is no
      # registry credential beside it.
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Gradle's JDK, not Tauri's. `gen/android` is committed rather than
      # generated — `native-packaging.md` has the icon measurement that made it
      # so — therefore nothing here runs `tauri android init`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Four ABIs in one universal APK, which is why `app_triple` answers nothing
      # for android and why the asset name carries no arch token.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native/src-tauri
          key: android-release

      # The NDK the runner already has, named through `ANDROID_NDK_LATEST_HOME`
      # for `check.yml`'s reason: pinning a version here would be a third place a
      # toolchain version is written down and the first that nothing compares.
      # `tauri android build` reads `NDK_HOME`; `ANDROID_HOME` the image sets.
      - name: the Android toolchain
        run: |
          set -euo pipefail
          ndk=${ANDROID_NDK_LATEST_HOME:?the runner image carries no Android NDK}
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/native install --frozen-lockfile
      - run: pnpm web:build

      # The desktop job's summary line, for the APK. Q4.127.
      - name: default server
        shell: bash
        env:
          SUGGESTED: ${{ vars.REEMOAT_DEFAULT_SERVER }}
        run: |
          echo "Default server compiled in: ${SUGGESTED:-none (the repository variable is unset)}" >> "$GITHUB_STEP_SUMMARY"

      - name: app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
          RELEASE_APP_TARGET: android
          TAURI: ${{ github.workspace }}/packages/native/node_modules/.bin/tauri
          # The desktop job's forward, for the APK — the same one line, and the
          # only other place `nativecheck` allows it. Q4.127.
          REEMOAT_DEFAULT_SERVER: ${{ vars.REEMOAT_DEFAULT_SERVER }}
          # ⚠ **The only four repository secrets this workflow reads, named in
          # this job and nowhere else.** `deploycheck` asserts both halves — that
          # these are the four, and that no other job mentions one. The script
          # refuses android with any one unset and names the one that is missing:
          # an unsigned APK installs on nothing, and one signed with a throwaway
          # key can never be replaced on a device that took it, because Android
          # refuses an upgrade whose signer changed.
          RELEASE_ANDROID_KEYSTORE: ${{ secrets.RELEASE_ANDROID_KEYSTORE }}
          RELEASE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_ANDROID_KEY_ALIAS }}
          RELEASE_ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_ANDROID_KEY_PASSWORD }}
        run: deploy/ci-release.sh app

      - uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: ${{ runner.temp }}/reemoat-release/apps/*
          if-no-files-found: error
          overwrite: true

  # Last, and only once the image it describes exists.
  publish:
    needs: [plan, manifest, app, app-android]
    # ⚠ **Without this line a release stops publishing anything the moment an app
    # job is skipped — which is every release today.** GitHub skips a job whose
    # `needs` includes a skipped one unless that job carries a conditional, and
    # both app jobs are gated on a target list that ships empty. So wiring them
    # up without this would have left every release pushing its image tags and
    # then quietly creating no release page at all: the half-done state that
    # `publish`-is-last exists to prevent, arriving by the other door.
    #
    # It is the one `if:` in a file whose header says it decides nothing, and
    # what it says is about the **graph** rather than about the release: an app
    # leg this release did not ask for must not take the release page with it.
    # The release decision stays in the script — `!cancelled()` deliberately lets
    # a **failed** app job reach `publish`, where the completeness gate refuses
    # by name and says which artifact is missing, rather than a silent skip.
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job here that may write to the repository, and all it writes is
      # the release — its notes, and the `install.sh` asset `README.md` tells
      # strangers to download. Same permission for both; `gh release create`
      # uploads the file in the call that creates the release.
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/reemoat-release

      # Every app artifact, merged into the one directory `RELEASE_APP_DIR`
      # defaults to — `$RELEASE_WORK/apps`, which is why no env var is set for it
      # below. Gated on the target list for the same reason the jobs above are:
      # with no `app-*` artifact anywhere in the run there is nothing for the
      # pattern to match, and what a zero-match download should mean is a
      # decision this file does not get to make.
      #
      # ⚠ **A `pattern:` will satisfy a re-run with a subset and say nothing**,
      # which is why `publish` re-derives the list it expects and refuses by
      # name. The re-run-one-job button this file names as its whole recovery
      # story is exactly the path that produces a subset.
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.app_targets != '' }}
        with:
          pattern: app-*
          merge-multiple: true
          path: ${{ runner.temp }}/reemoat-release/apps

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.sha }}
        run: deploy/ci-release.sh publish

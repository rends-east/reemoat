packages:
  - '.'
  # The control plane. Its own package because it is its own service with its
  # own database, and because nothing in the daemon may ever import from it —
  # the dependency runs one way, at enrollment, over HTTP.
  - 'packages/*'

allowBuilds:
  # esbuild's install script links its prebuilt platform binary; tsx needs it.
  esbuild: true
# **`minimumReleaseAge` is not set, so this exclusion currently excludes nothing.**
#
# Said here rather than left to be discovered, because the shape reads like a policy
# and is not one: `pnpm config get minimumReleaseAge` answers `undefined`, and the
# setting appears in no `.npmrc`, here or in either package. `pnpm pincheck` reports
# the state in its output for the same reason — a line that looks load-bearing and
# is inert is worse than no line, and this one had a driver asserting on it.
#
# Turning it on is a real decision with a measured cost, which is why it is left to
# be taken rather than taken here. With `minimumReleaseAge: 10080`, on 2026-08-02:
# 27 lockfile entries are rejected — every `@rollup/rollup-*@4.62.3` platform
# binary, published six days earlier as a transitive dependency of Vite — so every
# `pnpm <script>` in the repository fails until they age out. And it applies to
# `--frozen-lockfile` too, which is not obvious: that install stops being offline
# and becomes a network verification of all 367 entries against the registry, in CI
# and on every deploy.
#
# The lines below are what the escape hatch looks like when it is switched on: one
# entry per package that genuinely has to be fresher than the window.
#
# `pnpm pincheck` asserts that each names the version `package.json` pins, so these
# are not free-floating — they are the second of the three places a pin is written
# down, and a bump that edits one file and not the other fails there.
minimumReleaseAgeExclude:
  - '@agentclientprotocol/claude-agent-acp@0.63.0'
  - '@agentclientprotocol/codex-acp@1.1.9'
